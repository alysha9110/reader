<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F0">
<title>Reader</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root{
  --paper:#FAF7F0; --ink:#2C2C2A; --ink-soft:#5F5E5A; --ink-faint:#888780;
  --ink-ghost:#B4B2A9; --rule:#EDE7DA; --amber:#BA7517; --amber-bg:#FAEEDA;
  --amber-ink:#854F0B; --green:#0F6E56; --green-bg:#E1F5EE; --green-ink:#04342C;
  --red:#A32D2D;
  --serif:Georgia,'Iowan Old Style','Palatino Linotype',serif;
  --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);overscroll-behavior-y:contain}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0}
.screen{display:none;max-width:640px;margin:0 auto;min-height:100vh}
.screen.on{display:block}
.pad{padding:20px 18px 40px}

h1{font-family:var(--serif);font-size:20px;font-weight:400;margin:0}
h2{font-family:var(--serif);font-size:17px;font-weight:400;margin:0}
p{margin:0}
button{font-family:inherit;font-size:14px;color:var(--ink);background:none;
  border:.5px solid var(--ink-ghost);border-radius:20px;padding:10px 16px;cursor:pointer}
button:active{transform:scale(.98)}
button.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.wide{display:block;width:100%;text-align:center}
button.plain{border:none;padding:8px 4px;color:var(--ink-faint);font-size:12px}
button:disabled{opacity:.35}
input,textarea,select{font-family:inherit;font-size:15px;width:100%;background:var(--paper);
  color:var(--ink);border:.5px solid var(--ink-ghost);border-radius:10px;padding:10px}
textarea{font-family:var(--serif);line-height:1.6;resize:vertical}
label{font-size:12px;color:var(--ink-faint);display:block;margin-bottom:6px}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{font-size:12px;color:var(--ink-faint)}
.ghost{font-size:11px;color:var(--ink-ghost)}
.eyebrow{font-size:11px;letter-spacing:.04em;color:var(--ink-faint)}
.pill{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--rule);color:var(--ink-soft)}
.pill.warm{background:var(--amber-bg);color:var(--amber-ink)}
.pill.cool{background:var(--green-bg);color:var(--green)}
.bar{height:2px;background:var(--rule);margin:6px 0}
.bar>i{display:block;height:2px;background:var(--amber)}
.gap{margin-top:20px}
.rule{border-top:.5px solid var(--rule)}
.serif{font-family:var(--serif)}

.next{background:var(--ink);border-radius:16px;padding:16px;margin-bottom:22px}
.next .eyebrow{color:#FAC775}
.next .body{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--paper);margin:10px 0 14px}
.next .meta{color:var(--ink-ghost);font-size:11px}
.next button{background:var(--paper);color:var(--ink);border-color:var(--paper);width:100%}

.shelfitem{border-top:.5px solid var(--rule);padding:12px 0;cursor:pointer}

#page{padding:18px}
.para{font-family:var(--serif);font-size:17px;line-height:1.75;color:var(--ink);
  margin:0 0 18px;padding:6px 8px;border-radius:6px;transition:background .16s,color .16s;cursor:pointer}
.para.h{font-size:19px;margin-top:26px}
.para.q{border-left:2px solid var(--rule);border-radius:0;color:var(--ink-soft)}
.para.taken{background:var(--green-bg);color:var(--green-ink)}
.readbar{position:sticky;bottom:0;background:var(--paper);border-top:.5px solid var(--rule);
  padding:10px 18px;display:flex;align-items:center;justify-content:space-between}
.tophead{position:sticky;top:0;background:var(--paper);padding:12px 18px 0;z-index:2}

.float{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:20;display:none}
.float.on{display:block}

.card{border:.5px solid var(--rule);border-radius:12px;padding:14px;margin-bottom:10px}
.note{background:var(--green-bg);border-radius:10px;padding:10px 12px;margin-top:8px}
.note .t{font-family:var(--serif);font-size:14px;line-height:1.55;color:var(--green-ink)}

.chips{display:flex;gap:6px}
.chips button{flex:1;padding:8px 0;font-size:13px;border-radius:16px}
.chips button.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.sheet{position:fixed;inset:0;background:rgba(44,44,42,.4);z-index:40;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet>div{background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:18px 18px 0 0;padding:18px 18px 30px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);
  color:var(--paper);font-size:13px;padding:10px 18px;border-radius:20px;z-index:60;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;padding:40px 20px;color:var(--ink-ghost);font-family:var(--serif);font-size:16px}
mark{background:var(--amber-bg);color:var(--amber-ink);border-radius:3px;padding:0 2px}
</style>
</head>
<body>

<div id="s-home" class="screen on pad">
  <div class="row"><h1 id="today">Today</h1><span class="muted" id="duecount"></span></div>
  <div class="next gap" id="nextcard"></div>
  <div class="row"><span class="eyebrow">Reading now</span><span class="ghost" id="shelfcount"></span></div>
  <div id="shelf"></div>
  <div class="rule gap" style="padding-top:14px;display:flex;justify-content:space-between">
    <button class="plain" id="btn-add">+ Add book</button>
    <button class="plain" id="btn-archive">Archive</button>
    <button class="plain" id="btn-export">Export</button>
    <button class="plain" id="btn-settings">Settings</button>
  </div>
  <input type="file" id="file" accept=".epub,.txt,.md" style="display:none">
</div>

<div id="s-read" class="screen">
  <div class="tophead">
    <div class="row"><span class="muted" id="r-title"></span><span class="muted" id="r-pos"></span></div>
    <div class="bar"><i id="r-bar"></i></div>
  </div>
  <div id="page"></div>
  <div class="readbar">
    <span class="muted" id="r-hint">Tap a paragraph to extract it</span>
    <button class="plain" id="r-done">Done</button>
  </div>
  <button class="solid float" id="r-sel">Extract selection</button>
</div>

<div id="s-item" class="screen pad"></div>

<div id="s-list" class="screen pad">
  <div class="row"><h1 id="l-title">Archive</h1><button class="plain" id="l-back">Close</button></div>
  <div id="l-body" class="gap"></div>
</div>

<div class="sheet" id="sheet"><div id="sheet-body"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
